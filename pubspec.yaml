
name: classico_as
description: "CrewSync - Jobs, People, Together"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# ============================================================
# DEPENDENCIES
# ============================================================

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: 4.15.0
  firebase_auth: 6.7.0
  cloud_firestore: 6.10.0

  # Images and QR
  image_picker: ^1.2.3
  qr_flutter: ^4.1.0

  # Notifications
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.2

# ============================================================
# DEV DEPENDENCIES
# ============================================================

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# ============================================================
# CREWSYNC APPLICATION ICON
# ============================================================

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/logo.png"

  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/logo.png"
  adaptive_icon_foreground_inset: 16

  min_sdk_android: 21

# ============================================================
# FLUTTER
# ============================================================

flutter:
  uses-material-design: true

  assets:
    # Existing CrewSync logos
    - assets/logo.png
    - assets/logo1.png

    # CrewSync animated splash screen
    - assets/logo/teal.png
    - assets/logo/orange.png
    - assets/logo/hands.png
